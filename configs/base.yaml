# Base configuration shared by every experiment.
# Values live here (not in Python) so the experiments remain configurable.
data:
  d: 256
  k: 256
  n_train: 1024
  n_val: 256
  n_test: 256
  w0_std: 0.0625
  obs_noise: 0.0

train:
  # 50 epochs x 8 batches keeps exp01-exp04 within the CPU run budget.
  # The learning-rate grid deliberately spans three orders of magnitude:
  # full fine-tuning needs a small step, high-rank LoRA tolerates a larger one.
  epochs: 50
  batch_size: 128
  optimizer: adam
  lr_grid: [0.001, 0.01, 0.1]
  weight_decay: 0.0

seeds: [0, 1, 2, 3, 4]

target:
  name: low_rank
  cfg:
    true_rank: 8
    noise_std: 0.01
    delta_scale: 0.5

quantizer:
  name: none
  cfg: {}

methods:
  - name: full_ft
    grid: {}
  - name: lora
    grid:
      r: [1, 2, 4, 8, 16]
      alpha: [16]

include_no_finetune: true

extra: {}
