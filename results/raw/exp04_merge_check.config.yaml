data:
  d: 256
  k: 256
  n_train: 1024
  n_val: 256
  n_test: 256
  w0_std: 0.0625
  obs_noise: 0.0
train:
  epochs: 50
  batch_size: 128
  optimizer: adam
  lr_grid:
  - 0.001
  - 0.01
  - 0.1
  weight_decay: 0.0
seeds:
- 0
- 1
- 2
- 3
- 4
target:
  name: low_rank
  cfg:
    true_rank: 8
    noise_std: 0.01
    delta_scale: 0.5
quantizer:
  name: none
  cfg: {}
methods:
- name: full_ft
  grid: {}
- name: lora
  grid:
    r:
    - 4
    - 8
    - 16
    alpha:
    - 16
    init_std:
    - 0.01
include_no_finetune: false
extra:
  max_abs_err_threshold: 1.0e-05
  eval_batch_size: 256
name: exp04_merge_check
description: Numerical merge check for full fine-tuning and LoRA.
