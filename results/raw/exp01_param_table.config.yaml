  k: 1024
  n_train: 8
  n_val: 4
  n_test: 4
  w0_std: 0.0625
  obs_noise: 0.0
train:
  epochs: 1
  batch_size: 1
  optimizer: adam
  lr_grid:
  - 0.001
  - 0.01
  - 0.1
  weight_decay: 0.0
seeds:
- 0
- 1
- 2
- 3
- 4
target:
  name: low_rank
  cfg:
    true_rank: 8
    noise_std: 0.01
    delta_scale: 0.5
quantizer:
  name: none
  cfg: {}
methods:
- name: full_ft
  grid: {}
- name: lora
  grid:
    r:
    - 4
    - 8
    - 16
    alpha:
    - 16
    init_std:
    - 0.01
include_no_finetune: false
extra:
  dtype_bytes: 4
  optimizer_states: 2
name: exp01_param_table
description: Trainable parameter counts and analytical memory for a 1024x1024 layer.
